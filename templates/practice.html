{% extends "base.html" %}{% block content %}<section class="lesson-top"><p class="eyebrow">HANDS-ON LAB</p><h1>SQL Playground</h1><p class="sub">Read-only SELECT/WITH queries run karein. Sample tables: employees, departments, customers, orders.</p></section><div class="panel editor"><div class="editor-head"><span>query.sql</span><button class="btn small" onclick="resetDB()">Reset Database</button></div><textarea id="sql">SELECT e.name, d.name AS department, e.salary
FROM employees e
JOIN departments d ON e.department_id = d.id
ORDER BY e.salary DESC;</textarea><button class="btn" onclick="runSQL()">▶ Run Query</button><div id="output"></div><div class="samples"><button onclick="loadQuery('SELECT * FROM employees;')">All employees</button><button onclick="loadQuery('SELECT city, COUNT(*) AS total FROM employees GROUP BY city;')">Employees by city</button><button onclick="loadQuery('SELECT * FROM orders WHERE amount > 10000;')">Large orders</button></div></div>{% endblock %}
